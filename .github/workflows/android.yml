name: Android

# Pull requests that touch the app shell build a debug APK to try out (an artifact on the run).
# A tag android-v1.2.3 builds the signed release and publishes it as a release of this repository, on that
# tag. The installed app checks this repository's latest release for updates.
on:
  pull_request:
    paths:
      - android/**
      - capacitor-www/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/android.yml
  push:
    tags: ["android-v*"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci --no-audit --no-fund

      # Copies capacitor-www and the plugin list into android/ (both git-ignored there).
      - run: npx cap sync android

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            v="${GITHUB_REF_NAME#android-v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like android-v1.2.3"; exit 1; }
          else
            v=0.0.0
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew --no-daemon :kue-reader:testDebugUnitTest assembleDebug -PversionName=0.0.0

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: jatahin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Signing key
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "JATAHIN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: android
        env:
          JATAHIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JATAHIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JATAHIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PversionName=${{ steps.v.outputs.version }}

      - name: Check and package the release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::No signed APK; check the signing secrets"; exit 1; }
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk"

          mkdir dist
          cp "$apk" "dist/jatahin-$VERSION.apk"
          (cd dist && sha256sum "jatahin-$VERSION.apk" > "jatahin-$VERSION.apk.sha256")

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/android-v')
        with:
          name: release-apk
          path: dist/
          retention-days: 7

  # Only this job can write to the repository, and it runs only for a release tag: it builds nothing, it only
  # publishes what the build job signed and checked.
  release:
    name: publish release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          # Release notes: the tag's message, then the checksum.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" -q .object.sha > tag.sha
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$(cat tag.sha)" -q .message | sed '/-----BEGIN/,$d' > notes.md
          printf '\nSHA-256: `%s`\n' "$(cut -d' ' -f1 "dist/jatahin-$VERSION.apk.sha256")" >> notes.md

          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --repo "$GITHUB_REPOSITORY" --title "Jatahin! $VERSION" --notes-file notes.md
